name: create-release
'on':
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci_build:
    permissions:
      contents: write

    env:
      NWNSERVER_VERSION: "8193.37-17"
      NWN_ROOT: ${{ github.workspace }}/nwn
      NWN_HOME: ${{ github.workspace }}/nwn

    runs-on: ubuntu-latest
    name: 'NWN:EE CI Build'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # nasher/nwnsc brauchen zum Kompilieren der Skripte einen Teil der
      # offiziellen NWN-Serverdaten (nwscript.nss, Standard-Includes etc.).
      # Gleiche offizielle Quelle, die auch das nasher4gh-Docker-Image nutzt:
      # https://github.com/Ardesco/nasher4gh-images/blob/main/Dockerfile
      - name: Cache NWN server data
        id: cache-nwn
        uses: actions/cache@v5
        with:
          path: ${{ env.NWN_ROOT }}
          key: nwn-server-${{ env.NWNSERVER_VERSION }}

      - name: Download NWN server data
        if: steps.cache-nwn.outputs.cache-hit != 'true'
        run: |
          wget -q "https://nwn.beamdog.net/downloads/nwnee-dedicated-${NWNSERVER_VERSION}.zip"
          mkdir -p "$NWN_ROOT"
          unzip -q "nwnee-dedicated-${NWNSERVER_VERSION}.zip" -d "$NWN_ROOT"
          rm "nwnee-dedicated-${NWNSERVER_VERSION}.zip"

      # nasher nutzt seit Version 1.0.0 standardmaessig neverwinter.nim's
      # nwn_script_comp als Compiler statt des aelteren, separaten nwnsc -
      # genau der Compiler, den du hier haben willst, da er mit EE aktiv
      # weiterentwickelt wird. Ein separater Download ist nicht noetig:
      # "nimble install nasher" baut neverwinter.nim (und damit
      # nwn_script_comp) als Abhaengigkeit automatisch mit.
      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Cache fuer ~/.nimble: nasher + neverwinter.nim werden aus dem
      # Quellcode kompiliert, das kostet beim allerersten Lauf ein paar
      # Minuten. Mit Cache-Treffer faellt das danach wieder weg.
      - name: Cache nimble packages
        uses: actions/cache@v5
        with:
          path: ~/.nimble
          key: ${{ runner.os }}-nimble-nasher

      - name: Install nasher
        run: nimble install nasher -y

      - name: Build module
        run: nasher pack --default

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d-%H-%M')" >> "$GITHUB_OUTPUT"

      - name: Zip module
        id: zip
        run: |
          MODFILE=$(ls *.mod | head -n1)
          if [ -z "$MODFILE" ]; then
            echo "Kein .mod-File gefunden - Build fehlgeschlagen?"
            exit 1
          fi
          ZIPFILE="${MODFILE%.mod}.zip"
          zip -j "$ZIPFILE" "$MODFILE"
          echo "zipfile=$ZIPFILE" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.date.outputs.date }}
          name: ${{ steps.date.outputs.date }}
          draft: false
          prerelease: false
          files: ${{ steps.zip.outputs.zipfile }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
